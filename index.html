<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MONDRIAN ART</title>
    <style>
    .grid-container {
      display: grid;
      width: 748px;
      height: 748px;
      grid-template-columns: 2fr 2fr 1.2fr 0.8fr;
      grid-template-rows: 2fr 1.6fr 0.5fr;
      gap: 8px;
      background-color: black;
      margin: 20px auto;
      padding: 8px;
    }
    .first {
      background-color: orangered;
    }
    .card1 {
      background-color: yellow;
      grid-row: 3;
      grid-column: 2;
    }
    .card2 {
      background-color: white;
      grid-row: 1;
      grid-column: 2 / 5;
    }
    .card3 {
    background-color: white;
    grid-row: 2;
    grid-column: 1 / 3;
    }
    .card4 {
      background-color: white;
      grid-row: 2;
      grid-column: 3;
    }
    .card5 {
      background-color: blue;
      grid-row: 2;
      grid-column: 4;
    }
    .card6 {
      background-color: white;
      grid-row: 3;
      grid-column: 1;
    }
    .card7 {
      background-color: yellow;
      grid-row: 3;
      grid-column: 2;
    }
    .card8 {
      background-color: white;
      grid-row: 4;
      grid-column: 3;
    }
    </style>
    </head>
    <body>
    <div class="grid-container">
    <div class="first card"></div>
    <div class="card1"></div>
    <div class="card2"></div>
    <div class="card3"></div>
    <div class="card4"></div>
 <div class="card5"></div>
 <div class="card6"></div>
 <div class="card7"></div>
 <div class="card8"></div>
 <div class="card9"></div>
 </body>
 </html>
